name: Release notes budget preflight
on:
  pull_request:
    paths:
      - .github/release-scribe/config.json
      - .github/workflows/release-scribe-evaluation.yml
      - .github/workflows/release-scribe-preflight.yml
permissions:
  contents: read
  pull-requests: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: baptiste0928/cargo-install@v3
        with:
          crate: release-scribe
          git: https://github.com/tmandry/release-scribe
          commit: f8145d8d9f1262e8033773b5db737a724bd42db4
          locked: true
      - name: Replay current main with the proposed input budget
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/release-scribe/config.json?ref=$CANDIDATE_SHA" --jq .content | base64 --decode > "$RUNNER_TEMP/scribe-config.json"
          release-scribe evaluate --repo "$GITHUB_WORKSPACE" --config "$RUNNER_TEMP/scribe-config.json" --output "$RUNNER_TEMP/release-scribe-preflight"
